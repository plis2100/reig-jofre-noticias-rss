name: Actualizar RSS de Reig Jofre

on:
  workflow_dispatch:

  schedule:
    # Cada hora, de lunes a viernes.
    # Python comprueba el horario exacto de España:
    # desde las 07:00 hasta las 19:59.
    - cron: "47 5-18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-reig-jofre
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear RSS
        run: python actualizar_rss.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar RSS de Reig Jofre"
            git push
          fi
